<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - IsokoHub</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <!-- Firebase SDK -->
  <!-- Supabase SDK (Auth, User Management) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js?v=2"></script>
  <!-- Firebase SDK (Firestore for product database) -->

  <style>
    .product-detail-container {
      margin: 2rem auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      min-height: 600px;
    }
    .product-image-box {
      flex: 1.5;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      border-right: 1px solid var(--border-color);
    }
    .product-main-img {
      max-width: 100%;
      max-height: 500px;
      width: auto;
      height: auto;
      object-fit: contain !important;
      object-position: center;
    }
    .product-info-box {
      flex: 1;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      background: #fafafa;
    }
    .pd-header { border-bottom: 1px solid #ddd; padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
    .pd-category { color: #007185; font-size: 0.9rem; font-weight: 500; }
    .pd-title { font-size: 1.8rem; line-height: 1.3; margin: 0.5rem 0; color: #0f1111; }
    .pd-price-row { margin-bottom: 1.5rem; }
    .pd-price-label { font-size: 0.9rem; color: #565959; }
    .pd-price { font-size: 1.8rem; color: #B12704; font-weight: 500; }
    
    .pd-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* Advanced Description Sections */
    .pd-details-section {
      margin-top: 3rem;
      padding: 2rem;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .pd-section-title {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary-blue);
      display: inline-block;
      color: #0f1111;
    }
    .pd-specs-grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 1rem;
      font-size: 0.95rem;
    }
    .spec-label { font-weight: 700; color: #565959; background: #f3f3f3; padding: 0.5rem 1rem; }
    .spec-value { padding: 0.5rem 1rem; border-bottom: 1px solid #eee; }

    .feature-list { list-style: disc; padding-left: 1.5rem; margin-top: 1rem; }
    .feature-list li { margin-bottom: 0.8rem; color: #333; }

    .product-detail-shell {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      align-items: start;
      margin: 1.5rem 0 2rem;
      width: 100%;
    }

    .product-gallery-card,
    .product-info-card {
      background: white;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      width: 100%;
    }

    .product-gallery-card {
      padding: 0.9rem;
    }

    .gallery-main {
      position: relative;
      background: #f8fafc;
      border-radius: 16px;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      aspect-ratio: 1 / 1;
      max-height: min(62vh, 720px);
      overflow: hidden;
      transition: aspect-ratio 0.25s ease;
    }

    .product-main-img {
      max-width: 100%;
      max-height: calc(62vh - 1.5rem);
      width: 100%;
      height: 100%;
      object-fit: contain !important; /* ensure image is not zoomed or cropped */
      object-position: center;
      cursor: zoom-in;
      border-radius: 12px;
      display: block;
    }

    .gallery-nav,
    .gallery-modal-nav,
    .gallery-zoom-btn,
    .gallery-modal-close {
      border: none;
      background: rgba(15, 23, 42, 0.8);
      color: white;
      border-radius: 999px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .gallery-zoom-btn {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      width: auto;
      padding: 0 1rem;
      gap: 0.35rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .gallery-prev,
    .gallery-modal-prev {
      left: 0.75rem;
    }

    .gallery-next,
    .gallery-modal-next {
      right: 0.75rem;
    }

    .gallery-thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 0.6rem;
      margin-top: 0.9rem;
    }

    .gallery-thumb {
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 0.25rem;
      background: #f8fafc;
      cursor: pointer;
      overflow: hidden;
    }

    .gallery-thumb.active {
      border-color: var(--primary-blue);
    }

    .gallery-thumb img {
      width: 100%;
      height: 72px;
      object-fit: contain; /* show full image, avoid cropping/zoom */
      object-position: center;
      border-radius: 8px;
      background: transparent;
    }

    .product-info-card {
      padding: 0.9rem;
      background: #f8fafc;
    }

    .detail-stack {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .detail-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 1rem 1.1rem;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
    }

    .product-actions {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .contact-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .contact-action {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      padding: 0.65rem 0.75rem;
      border: 1px solid transparent;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .contact-action:hover {
      color: #ffffff;
      transform: translateY(-1px);
      filter: saturate(1.08);
    }

    .contact-action-whatsapp {
      background: linear-gradient(135deg, #16a34a, #15803d);
      box-shadow: 0 5px 14px rgba(22, 163, 74, 0.18);
    }

    .contact-action-email {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 5px 14px rgba(37, 99, 235, 0.18);
    }

    .contact-action-chat {
      background: linear-gradient(135deg, #0f766e, #115e59);
      box-shadow: 0 5px 14px rgba(15, 118, 110, 0.18);
    }

    .contact-action.is-disabled {
      opacity: 0.52;
      pointer-events: none;
      filter: grayscale(0.25);
    }

    .contact-action-icon {
      display: grid;
      place-items: center;
      flex: 0 0 1.9rem;
      width: 1.9rem;
      height: 1.9rem;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
    }

    .contact-action-copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.15;
    }

    .contact-action-copy strong {
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .contact-action-copy small {
      margin-top: 0.2rem;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.68rem;
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      .product-detail-shell {
        grid-template-columns: 1fr;
      }

      .gallery-main {
        min-height: 320px;
        max-height: 50vh;
      }

      .product-main-img {
        max-height: calc(50vh - 1rem);
      }
    }

    @media (max-width: 640px) {
      .product-gallery-card,
      .product-info-card {
        border-radius: 16px;
        padding: 0.7rem;
      }

      .gallery-main {
        min-height: 260px;
        padding: 0.5rem;
      }

      .product-main-img {
        max-height: 300px;
      }

      .detail-card {
        padding: 0.85rem 0.9rem;
      }

      .detail-card-title {
        letter-spacing: 0.06em;
      }

      .contact-actions {
        grid-template-columns: 1fr;
      }
    }

    .detail-card-title {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 0.7rem;
    }

    .detail-card-value {
      color: #0f172a;
      line-height: 1.6;
      font-size: 0.96rem;
    }

    .detail-card-value strong {
      color: #0f172a;
    }

    .seller-profile-inline-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.65rem;
      color: #2563eb;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
    }

    .seller-profile-inline-link:hover {
      text-decoration: underline;
    }

    .detail-header-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .pd-header {
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.8rem;
      margin-bottom: 0;
    }

    .gallery-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(8px);
    }

    .gallery-modal[aria-hidden="false"] {
      display: flex;
    }

    .gallery-modal-backdrop {
      position: absolute;
      inset: 0;
      background: transparent;
    }

    .gallery-modal-body {
      position: relative;
      width: min(90vw, 900px);
      height: min(80vh, 720px);
      max-width: 100%;
      max-height: 100%;
      display: grid;
      place-items: center;
      padding: 1rem;
      z-index: 1;
    }

    .gallery-modal-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      padding: 0;
      transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)) scale(var(--zoom-level, 1));
      transform-origin: center center;
      transition: transform 0.2s ease;
      cursor: zoom-in;
      user-select: none;
      -webkit-user-drag: none;
    }

    .gallery-modal-image.is-pannable {
      cursor: grab;
    }

    .gallery-modal-image.is-pannable:active {
      cursor: grabbing;
    }

    /* Fullscreen adjustments: make modal body and image fill viewport when in fullscreen */
    .gallery-modal:fullscreen,
    .gallery-modal:-webkit-full-screen {
      align-items: stretch;
      justify-content: center;
    }

    .gallery-modal:fullscreen .gallery-modal-body,
    .gallery-modal:-webkit-full-screen .gallery-modal-body {
      width: 100vw;
      height: 100vh;
      padding: 0;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-modal:fullscreen .gallery-modal-image,
    .gallery-modal:-webkit-full-screen .gallery-modal-image {
      max-width: 98vw;
      max-height: 98vh;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)) scale(var(--zoom-level, 1));
    }

    .gallery-controls {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.6rem;
      z-index: 2;
    }

    .gallery-controls button {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: none;
      background: rgba(15, 23, 42, 0.9);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.24);
    }

    .gallery-modal-close {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      z-index: 2;
    }

    .gallery-modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }

    .gallery-modal-prev {
      left: 0.9rem;
    }

    .gallery-modal-next {
      right: 0.9rem;
    }

    .add-cart-btn {
      margin-top: 1rem;
      padding: 1rem;
      font-size: 1.05rem;
      background: linear-gradient(135deg, #febd69, #f59e0b);
      color: #131921;
      border: none;
    }

    @media (max-width: 900px) {
      .product-detail-shell {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .product-gallery-card,
      .product-info-card {
        border-radius: 16px;
      }

      .gallery-main {
        max-height: 50vh;
      }

      .gallery-modal-body {
        width: min(96vw, 760px);
      }

      .gallery-controls {
        bottom: 0.75rem;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 0.75rem;
      }

      .product-info-card {
        padding: 1rem;
      }

      .gallery-main {
        max-height: 360px;
        padding: 0.5rem;
      }

      .gallery-zoom-btn {
        padding: 0 0.8rem;
        font-size: 0.85rem;
        height: 38px;
      }

      .gallery-thumb img {
        height: 56px;
      }

      .gallery-thumbs {
        grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
        gap: 0.45rem;
      }

      .gallery-modal {
        padding: 0;
      }

      .gallery-modal-body {
        padding: 0.7rem;
      }

      .gallery-modal-close,
      .gallery-controls button,
      .gallery-modal-nav {
        width: 38px;
        height: 38px;
      }

      .gallery-modal-image {
        max-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="container" id="product-wrapper">
      <!-- Injected via JS -->
      <div style="text-align: center; padding: 5rem;" id="loading-state">
        <h2 class="text-muted">Loading product...</h2>
      </div>
    </div>
  </main>
  
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/product-details.js"></script>
</body>
</html>
