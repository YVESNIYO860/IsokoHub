<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - IsokoHub</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pZM2X9g6Qa+2LmU+v2cR6LIjNy+e0mT+P6WfQJ+vWOTqUP9zh/8Pt7JMTfVj7F3pG9KHCs+WmE7y7LMr2XRL5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #f8fafc;
    }

    .support-hero {
      background: linear-gradient(135deg, #0f172a 0%, #14213d 100%);
      color: white;
      padding: 4rem 0 3rem;
    }

    .support-hero h1 {
      font-size: clamp(2rem, 3.6vw, 2.8rem);
      margin-bottom: 0.8rem;
    }

    .support-hero p {
      max-width: 720px;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .support-hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .whatsapp-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #25d366 0%, #22c55e 100%);
      color: white;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .whatsapp-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(37, 211, 102, 0.28);
      color: white;
      text-decoration: none;
    }

    .whatsapp-cta-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: white;
      font-size: 1.1rem;
    }

    .support-intro--highlight {
      display: grid;
      gap: 1rem;
      padding: 1.3rem;
      border-radius: 1.2rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .support-intro--highlight p {
      color: #e2e8f0;
      line-height: 1.7;
      margin: 0;
    }

    .support-return-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .support-return-home:hover {
      color: #2563eb;
    }

    .support-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      padding: 2rem 0 3rem;
      align-items: start;
    }

    .support-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.4rem;
      box-shadow: var(--shadow-sm);
      max-width: 760px;
      margin: 0 auto;
    }

    .support-card--single {
      padding: 0;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .support-card--right {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 100%;
    }

    .support-card h2 {
      margin-bottom: 0.7rem;
      font-size: 1.25rem;
    }

    .support-card p {
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .support-intro {
      padding: 1.2rem 1.3rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
      border: 1px solid #dbeafe;
      margin-bottom: 0.25rem;
    }

    .support-intro strong {
      display: block;
      margin-bottom: 0.35rem;
      color: #1d4ed8;
      font-size: 1rem;
    }

    .support-intro p {
      margin: 0;
      color: #475569;
      font-size: 0.95rem;
    }

    .support-form .form-group {
      margin-bottom: 1rem;
    }

    .support-form textarea {
      min-height: 140px;
      resize: vertical;
    }

    @media (max-width: 900px) {
      .support-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="support-hero">
      <div class="container">
        <div class="support-card support-card--single">
          <div class="support-intro support-intro--highlight">
            <strong>We are ready to help you</strong>
            <p>Need help with an order, account, listing, or general question? Tap the button below to start a WhatsApp chat with our support team.</p>
            <a href="https://wa.me/250798269987" target="_blank" rel="noopener" class="whatsapp-cta">
              <span class="whatsapp-cta-icon"><i class="fa-brands fa-whatsapp"></i></span>
              <span>Chat on WhatsApp</span>
            </a>
            <a href="index.html" class="support-return-home">Return to home</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
