<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - IsokoHub</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <!-- Firebase SDK -->
  <!-- Supabase SDK (Auth, User Management) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js?v=2"></script>
  <!-- Firebase SDK (Firestore for product database) -->

  <style>
    .products-layout {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    .filters-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: white;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      align-self: flex-start;
      position: sticky;
      top: 88px;
    }
    .filters-sidebar h3 {
      font-size: 1rem;
      margin-bottom: 0.7rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.35rem;
    }
    .filter-select {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: white;
      color: var(--text-dark);
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
    }
    .products-main {
      flex: 1;
    }
    .search-summary {
      font-size: 1rem;
      margin-bottom: 0.8rem;
      padding: 0.2rem 0;
    }

    .search-summary h2 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.2;
      word-break: break-word;
    }

    .search-summary p {
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
      .products-layout {
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
      .filters-sidebar {
        width: 100%;
        position: static;
        padding: 0.9rem;
      }
      .products-main {
        width: 100%;
      }
      .search-summary {
        margin-bottom: 0.6rem;
      }
      .search-summary h2 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <div class="products-layout">
        <!-- Sidebar -->
        <aside class="filters-sidebar">
          <h3>Categories</h3>
          <select id="category-filter-select" class="filter-select">
            <option value="all">All Categories</option>
          </select>

          <h3>Condition</h3>
          <select id="condition-filter-select" class="filter-select">
            <option value="all">All Conditions</option>
            <option value="New">New</option>
            <option value="Used">Used</option>
          </select>

          <h3>District</h3>
          <select id="district-filter-select" class="filter-select">
            <option value="all">All Districts</option>
          </select>
        </aside>

        <!-- Main Product Area -->
        <div class="products-main" style="margin-bottom: 4rem;">
          <div class="search-summary" id="search-summary">
            <h2>All Products</h2>
          </div>
          <div class="product-grid" id="products-container" style="margin-top: 0">
            <!-- Products rendered here -->
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
