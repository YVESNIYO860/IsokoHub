  <script>
    (() => {
      try {
        const settings = JSON.parse(localStorage.getItem('isokoHubDrawerSettings') || '{}');
        document.documentElement.dataset.theme = settings.theme === 'dark' ? 'dark' : 'light';
      } catch (error) {
        console.warn('Unable to read the saved IsokoHub theme preference.', error);
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/site-refinements.css">
